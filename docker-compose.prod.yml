# Production compose for solveathome on server01.
# Two identical slots, backend-a and backend-b, share the network alias `solveathome-backend` that Caddy (shared, /data/services/caddy)
# proxies solveathome.org to. Exactly one slot serves between deploys; `scripts/deploy-remote.sh` builds and starts the idle one,
# proves it answers, then stops the live one (Chris, Sep 11 2026: a release must not take the site down). Never `up -d` both by hand.
# Run something in the live slot: `bash scripts/prod-exec.sh node dist/scripts/<name>.js`.

x-backend: &backend
  build:
    context: .
    target: production
  env_file: .env
  restart: unless-stopped
  # Hardening (Sep 10): no root, no capabilities, no privilege escalation, a read-only image with tmpfs for /tmp, bounded memory and processes.
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 4g
  pids_limit: 512
  stop_grace_period: 20s
  volumes:
    - ./data/dumps:/app/data/dumps
    - ./data/files:/app/data/files
    - ./data/overlay:/app/data/overlay
    - ./data/repos:/app/data/repos:ro
    - ./data/seed:/app/data/seed:ro
  networks:
    solveathome-network: {}
    web:
      aliases: [solveathome-backend]
  depends_on:
    postgres:
      condition: service_healthy

services:
  backend-a:
    <<: *backend
    container_name: solveathome-backend-a
  backend-b:
    <<: *backend
    container_name: solveathome-backend-b

  postgres:
    image: postgres:16-alpine
    container_name: solveathome-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - solveathome-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  solveathome-network:
  web:
    external: true
