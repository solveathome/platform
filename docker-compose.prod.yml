# Production compose for solveathome on server01.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Caddy (shared, /data/services/caddy) reverse-proxies solveathome.org to solveathome-backend:8600 over the `web` network.

services:
  backend:
    build:
      context: .
      target: production
    container_name: solveathome-backend
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data/dumps:/app/data/dumps
      - ./data/files:/app/data/files
      - ./data/overlay:/app/data/overlay
      - ./data/repos:/app/data/repos:ro
    networks:
      - solveathome-network
      - web
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: solveathome-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - solveathome-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  solveathome-network:
  web:
    external: true
