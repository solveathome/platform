<script>
const params = new URLSearchParams(location.search);
const next = /^\/(?!\/)/.test(params.get('next') || '') ? params.get('next') : '/';
loadWho(document.querySelector('#who')).then((me) => {
  if (!me.signed_in) { location.href = `/auth/github?next=${encodeURIComponent(location.pathname + location.search)}`; return; }
  emailForm(document.querySelector('#email'), { from: 'welcome', next });
});
</script>
