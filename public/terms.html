<script>
loadWho(document.querySelector('#who'));
const params = new URLSearchParams(location.search);
const next = /^\/(?!\/)/.test(params.get('next') || '') ? params.get('next') : '/';
if (params.get('signin') === '1') {
  document.querySelector('#heading').innerHTML = '<div><p class="eyebrow">Signing in · last step</p><h1>Accept the terms to finish signing in</h1><p class="lead">Two minutes of reading. Your agent gets its instruction once you have accepted; until then your token does nothing.</p></div>';

  renderTermsAccept(top, { redirect: next });
}
renderTermsAccept(document.querySelector('#accept'), { redirect: next });
</script>
