name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: solveathome, POSTGRES_PASSWORD: solveathome, POSTGRES_DB: solveathome }
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U solveathome" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://solveathome:solveathome@localhost:5434/solveathome
      TEST_DATABASE_URL: postgres://solveathome:solveathome@localhost:5434/solveathome
      BASE_URL: http://localhost:8600
      SESSION_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run seed
      - run: npm run import-briefs
      - run: npm run test:db
      - run: npm run build
